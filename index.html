<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forge — Workout Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF9;--card:#FFFFFF;--card2:#F2F2F0;--line:#E8E8E5;--text:#141516;--mut:#6B6E73;--mut2:#A3A6AA;
  --acc:#4A6E8C;--acc-soft:rgba(74,110,140,.10);--acc-ink:#FFFFFF;
  --ok:#6F8C78;--ok-soft:rgba(111,140,120,.14);
  --warn:#B89A62;--warn-soft:rgba(184,154,98,.16);
  --blue:#5F7F99;--blue-soft:rgba(95,127,153,.13);
  --purple:#8E7F9C;--purple-soft:rgba(142,127,156,.15);
  --danger:#A8615A;--danger-soft:rgba(168,97,90,.10);
  --done:rgba(74,110,140,.07);--ink:#141516;--ink-text:#FFFFFF;
  --shadow:0 1px 2px rgba(20,21,22,.04);
  --r:14px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
html[data-theme=dark]{
  --bg:#121314;--card:#1A1B1D;--card2:#232427;--line:#2B2D30;--text:#ECECEA;--mut:#9A9DA2;--mut2:#63666B;
  --acc:#7E9FBB;--acc-soft:rgba(126,159,187,.14);--acc-ink:#121314;
  --ok:#8FA897;--ok-soft:rgba(143,168,151,.15);--warn:#C8AE7E;--warn-soft:rgba(200,174,126,.15);
  --blue:#8BA4B9;--blue-soft:rgba(139,164,185,.15);--purple:#A99BB6;--purple-soft:rgba(169,155,182,.16);
  --danger:#C0827B;--danger-soft:rgba(192,130,123,.12);--done:rgba(126,159,187,.09);--ink:#ECECEA;--ink-text:#121314;--shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.35}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--text)}
.app{max-width:600px;margin:0 auto;min-height:100vh;padding:calc(var(--sat) + 8px) 16px calc(var(--sab) + 110px)}
.hidden{display:none!important}

/* top bar */
.top{display:flex;align-items:center;gap:8px;min-height:44px;margin-bottom:6px;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
.top .ttl{flex:1;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none;color:var(--text)}
.icon-btn svg{width:20px;height:20px}
.big-title{font-size:28px;font-weight:700;letter-spacing:-.03em;margin:4px 0 16px}
.sub{color:var(--mut);font-size:13px}
.sec{font-size:11px;font-weight:600;color:var(--mut2);text-transform:uppercase;letter-spacing:.12em;margin:22px 2px 10px;display:flex;align-items:center;justify-content:space-between}
.sec button{color:var(--acc);text-transform:none;letter-spacing:0;font-size:14px;font-weight:600}

.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;border:1px solid var(--line);box-shadow:var(--shadow)}
.card.tap{cursor:pointer;transition:transform .08s}
.card.tap:active{transform:scale(.99)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b{font-weight:700}.m{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.hero{background:var(--ink);color:var(--ink-text);border-radius:18px;padding:20px;margin-bottom:12px}
.hero .m{color:var(--ink-text);opacity:.7}
.hero .btn{background:var(--ink-text);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--acc);color:var(--acc-ink);letter-spacing:-.01em;white-space:nowrap}
.btn.sec2{background:var(--card2);color:var(--text)}
.btn.ghost{background:transparent;color:var(--acc)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.ok{background:var(--ink);color:var(--ink-text)}
.btn.sm{height:34px;padding:0 12px;border-radius:10px;font-size:13px}
.btn.full{width:100%}
.btn:disabled{opacity:.4}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:var(--card2);color:var(--mut);font-size:12px;font-weight:600;margin:2px 4px 2px 0;white-space:nowrap}
.chip.p{background:var(--acc-soft);color:var(--acc)}
.chip.c{background:var(--blue-soft);color:var(--blue)}
.chips{display:flex;flex-wrap:wrap}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{height:32px;padding:0 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-weight:600;font-size:13px;white-space:nowrap;flex:none}
.fchip.on{background:var(--ink);color:var(--ink-text);border-color:var(--ink)}
.toggle-chip{height:32px;padding:0 12px;border-radius:999px;background:var(--card2);color:var(--mut);font-weight:600;font-size:13px;margin:0 6px 6px 0}
.toggle-chip.on{background:var(--acc);color:var(--acc-ink)}
.toggle-chip.on2{background:var(--mut);color:var(--card)}

.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:0 2px 6px;text-transform:uppercase;letter-spacing:.05em}
.inp{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;outline:none}
textarea.inp{height:auto;min-height:70px;padding:10px 12px;resize:vertical}
.inp:focus{border-color:var(--acc)}
.search{position:relative;margin-bottom:10px}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:12px;width:20px;height:20px;color:var(--mut)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px}
.seg button{flex:1;height:36px;font-size:13px;padding:0 4px;border-radius:10px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.list-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-bottom:0}
.list-item:last-child{border-bottom:1px solid var(--line)}
.list-item:first-child{border-radius:var(--r) var(--r) 0 0}
.list-item:last-child{border-radius:0 0 var(--r) var(--r)}
.list-item:only-child{border-radius:var(--r)}
.list{margin-bottom:12px}
.avatar{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:600;letter-spacing:-.02em;font-size:14px;flex:none;background:var(--card2);color:var(--mut)}
.avatar.s{background:var(--acc-soft);color:var(--acc)}
.avatar.c{background:var(--blue-soft);color:var(--blue)}
.avatar.b{background:var(--purple-soft);color:var(--purple)}
.avatar.t{background:var(--warn-soft);color:var(--warn)}
.avatar.m{background:var(--ok-soft);color:var(--ok)}
.chip.g{background:var(--ok-soft);color:var(--ok)}
.hbar.g .tr>div{background:var(--ok)}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.check.on{background:var(--ink);border-color:var(--ink)}
.check.on svg{display:block}
.check svg{display:none;width:14px;height:14px;color:var(--ink-text)}

/* exercise blocks */
.exb{background:var(--card);border-radius:var(--r);padding:16px 12px 12px;margin-bottom:12px;border:1px solid var(--line);box-shadow:var(--shadow)}
.exb-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.exb-h .nm{font-weight:600;font-size:16px;letter-spacing:-.01em;color:var(--text);cursor:pointer}
.exb-h .icon-btn{border:0}
.exb-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-2px 0 8px}
.mini-sel{height:28px;border-radius:8px;border:0;background:var(--card2);padding:0 8px;font-size:12px;font-weight:600;color:var(--mut)}
.note-inp{width:100%;border:0;background:transparent;color:var(--mut);font-size:13px;padding:2px 0 8px;outline:none}
.sets-h,.set-r{display:grid;align-items:center;gap:6px}
.sets-h{font-size:11px;font-weight:700;color:var(--mut2);text-transform:uppercase;letter-spacing:.05em;padding:0 2px 4px}
.sets-h>div{text-align:center}
.set-r{padding:4px 2px;border-radius:10px;margin-bottom:2px;transition:background .15s}
.set-r.done{background:var(--done)}
.set-n{height:32px;border-radius:9px;background:var(--card2);font-weight:600;font-size:13px;display:grid;place-items:center}
.set-n.W{color:var(--warn)}.set-n.D{color:var(--purple)}.set-n.F{color:var(--danger)}
.prev{font-size:12px;color:var(--mut2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev.tap{cursor:pointer}
.cell{height:34px;width:100%;border-radius:9px;border:0;background:var(--card2);text-align:center;font-weight:600;font-size:15px;outline:none;padding:0 4px;min-width:0}
.cell::placeholder{color:var(--mut2);font-weight:600}
.cell:focus{box-shadow:0 0 0 2px var(--acc)}
.set-r.done .cell{background:transparent}
.ck{height:32px;border-radius:9px;background:var(--card2);display:grid;place-items:center}
.ck svg{width:18px;height:18px;color:var(--mut2)}
.set-r.done .ck{background:var(--acc)}
.set-r.done .ck svg{color:var(--acc-ink)}
.set-r.tight .cell{font-size:13px;padding:0 2px}.set-r.tight .prev{font-size:11px}
.add-set{width:100%;height:36px;border-radius:10px;background:var(--card2);color:var(--mut);font-weight:700;font-size:13px;margin-top:6px}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tabbar .in{max-width:600px;margin:0 auto;display:flex}
.tab{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:500;letter-spacing:.02em;color:var(--mut2)}
.tab svg{stroke-width:1.7}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--text)}
.resume{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 66px);z-index:21;width:min(568px,calc(100% - 24px));background:var(--ink);color:var(--ink-text);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);cursor:pointer}
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 14px);z-index:22;width:min(568px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.rest .bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.rest .bar>div{height:100%;background:var(--acc);transition:width 1s linear}
.rest .t{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;min-width:74px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(20,21,22,.38);animation:fade .15s}
.sheet{position:relative;width:min(600px,100%);max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(var(--sab) + 18px);animation:up .2s ease-out}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .mi{display:flex;align-items:center;width:100%;height:50px;padding:0 6px;font-weight:600;border-bottom:1px solid var(--line);text-align:left}
.sheet .mi:last-child{border-bottom:0}
.sheet .mi.danger{color:var(--danger)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;top:calc(var(--sat) + 14px);left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--ink-text);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:fade .2s;max-width:90%}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--line)}
.stat .v{font-size:21px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
.hbar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.hbar .lb{width:92px;color:var(--mut);font-weight:600;flex:none}
.hbar .tr{flex:1;height:10px;background:var(--card2);border-radius:9px;overflow:hidden}
.hbar .tr>div{height:100%;background:var(--acc);border-radius:9px}
.hbar .vv{width:34px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.cols .c>div{width:100%;background:var(--acc);border-radius:6px 6px 3px 3px;min-height:3px}
.cols .c>div.z{background:var(--card2)}
.cols .c span{font-size:10px;color:var(--mut2);font-weight:600}
.empty{text-align:center;padding:34px 16px;color:var(--mut)}
.empty .e{font-size:38px;margin-bottom:6px}
.elapsed{font-variant-numeric:tabular-nums;font-weight:700;color:var(--mut);font-size:14px}
.pill{font-size:10px;font-weight:600;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:var(--acc-soft);color:var(--acc)}
.hist-set{display:flex;gap:10px;font-size:14px;padding:3px 0;font-variant-numeric:tabular-nums}
.hist-set .k{width:22px;color:var(--mut2);font-weight:700}
svg.chart{width:100%;height:auto;display:block}
.dragh{color:var(--mut2)}
.kbd-hint{font-size:12px;color:var(--mut2);margin:4px 2px 0}
.prog-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.pchip{height:28px;padding:0 10px;border-radius:8px;background:var(--card2);font-size:12px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:5px}
.pchip.off{color:var(--mut2)}
.sug{display:flex;gap:8px;align-items:flex-start;background:var(--card2);border-left:3px solid var(--acc);border-radius:10px;padding:8px 10px;margin:0 0 10px;font-size:13px}
.sug b{display:block;color:var(--text)}
.sug span{color:var(--mut);font-size:12px}
.delta{font-weight:700;font-size:13px}
.delta.up{color:var(--acc)}.delta.dn{color:var(--danger)}.delta.fl{color:var(--mut)}
table.pr{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.pr td{padding:6px 2px;border-bottom:1px solid var(--line)}
table.pr tr:last-child td{border-bottom:0}
table.pr td:last-child{text-align:right;color:var(--mut);font-size:12px}
.rt{background:var(--blue-soft);color:var(--blue)}
.sheet .num{width:80px;text-align:center}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--text)}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;vertical-align:middle}
.pstripe{border-left:3px solid var(--pc,transparent)}
.wkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:8px 0}
.wchip{height:44px;border-radius:10px;background:var(--card2);font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;color:var(--mut);border:2px solid transparent}
.wchip small{font-size:9px;font-weight:700;letter-spacing:.04em}
.wchip.dl{background:var(--purple-soft);color:var(--purple)}
.wchip.cur{border-color:var(--pc,var(--acc));color:var(--text)}
.wchip.past{opacity:.55}
.chip.dl,.pill.dl{background:var(--purple-soft);color:var(--purple)}
.cols .c>div.dl{background:var(--purple)}
.pbar{height:6px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:8px}
.pbar>div{height:100%;background:var(--pc,var(--acc));border-radius:9px}

.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:10px;background:var(--card2);font-weight:800;font-size:18px}
.stepper .v{min-width:86px;text-align:center;font-weight:700}
.mini-row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
</style>
</head>
<body>
<div class="app" id="app"><div id="view"></div></div>
<div id="resume" class="resume hidden" data-a="resume"></div>
<div id="rest" class="rest hidden"></div>
<nav class="tabbar" id="tabbar"><div class="in" id="tabs"></div></nav>
<div id="sheet-wrap" class="sheet-wrap hidden"><div class="scrim" data-a="sheet-close"></div><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
/* ============================== DATA ============================== */
const MUSCLES=['Chest','Front Delts','Side Delts','Rear Delts','Triceps','Biceps','Forearms','Lats','Upper Back','Traps','Lower Back','Abs','Obliques','Glutes','Quads','Hamstrings','Adductors','Abductors','Hip Flexors','Calves','Tibialis','Neck','Cardio'];
const EQUIP=['Barbell','Dumbbell','Machine','Cable','Bodyweight','Kettlebell','Band','Smith Machine','EZ Bar','Trap Bar','Cardio Machine','None','Other'];
const TYPES={s:{label:'Strength',m:['weight','reps']},b:{label:'Bodyweight',m:['reps']},c:{label:'Cardio',m:['distance','time']},t:{label:'Timed',m:['time']},m:{label:'Mobility',m:['time']}};
const METRICS={
  weight:{label:'Weight'},reps:{label:'Reps'},distance:{label:'Distance'},distm:{label:'Distance (meters)'},
  time:{label:'Time'},speed:{label:'Speed'},incline:{label:'Incline %'},level:{label:'Level / Resistance'},
  calories:{label:'Calories'},hr:{label:'Avg heart rate'}
};
const METRIC_ORDER=['weight','reps','distance','distm','time','speed','incline','level','calories','hr'];
const KINDS={W:'Warm-up',N:'Working',D:'Drop set',F:'Failure'};
const RUN_TYPES=['Easy','Long','Tempo','Intervals','Recovery','Fartlek','Hills','Progression','Race'];
const RUN_RPE={Easy:4,Long:5,Tempo:7,Intervals:8,Recovery:3,Fartlek:7,Hills:8,Progression:7,Race:10};

const BUILTIN_RAW=`Barbell Bench Press|s|Chest|Triceps;Front Delts|Barbell
Incline Barbell Bench Press|s|Chest|Front Delts;Triceps|Barbell
Dumbbell Bench Press|s|Chest|Triceps;Front Delts|Dumbbell
Incline Dumbbell Press|s|Chest|Front Delts;Triceps|Dumbbell
Decline Bench Press|s|Chest|Triceps|Barbell
Machine Chest Press|s|Chest|Triceps;Front Delts|Machine
Cable Fly|s|Chest|Front Delts|Cable
Dumbbell Fly|s|Chest|Front Delts|Dumbbell
Pec Deck|s|Chest||Machine
Push-Up|b|Chest|Triceps;Front Delts;Abs|Bodyweight
Dip|b|Chest;Triceps|Front Delts|Bodyweight
Deadlift|s|Glutes;Hamstrings;Lower Back|Upper Back;Traps;Quads;Forearms|Barbell
Sumo Deadlift|s|Glutes;Quads;Adductors|Hamstrings;Lower Back;Traps|Barbell
Trap Bar Deadlift|s|Quads;Glutes|Hamstrings;Lower Back;Traps|Trap Bar
Romanian Deadlift|s|Hamstrings;Glutes|Lower Back;Forearms|Barbell
Dumbbell Romanian Deadlift|s|Hamstrings;Glutes|Lower Back|Dumbbell
Pull-Up|b|Lats|Biceps;Upper Back|Bodyweight
Chin-Up|b|Lats;Biceps|Upper Back|Bodyweight
Weighted Pull-Up|s|Lats|Biceps;Upper Back|Bodyweight
Lat Pulldown|s|Lats|Biceps;Upper Back|Cable
Barbell Row|s|Upper Back;Lats|Biceps;Rear Delts;Lower Back|Barbell
Dumbbell Row|s|Lats;Upper Back|Biceps;Rear Delts|Dumbbell
Seated Cable Row|s|Upper Back;Lats|Biceps;Rear Delts|Cable
T-Bar Row|s|Upper Back;Lats|Biceps;Rear Delts|Barbell
Chest-Supported Row|s|Upper Back|Lats;Rear Delts;Biceps|Machine
Straight-Arm Pulldown|s|Lats||Cable
Face Pull|s|Rear Delts|Upper Back;Traps|Cable
Barbell Shrug|s|Traps||Barbell
Dumbbell Shrug|s|Traps||Dumbbell
Back Extension|b|Lower Back|Glutes;Hamstrings|Bodyweight
Overhead Press|s|Front Delts|Side Delts;Triceps|Barbell
Seated Dumbbell Shoulder Press|s|Front Delts|Side Delts;Triceps|Dumbbell

async function initCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();
    if(!id)return;
    DB=db;UID=id;libRef=DB.doc('data/users/'+UID+'/library');
    const [libSnap,sessSnap]=await withTimeout(Promise.all([libRef.get(),libRef.collection('sessions').orderBy('startedAt','desc').limit(1000).get()]),12000);
    storeMode='cloud';
    if(libSnap.exists){
      const local=S.lib;
      S.lib=normalizeLib(clone(libSnap.data()));
      if(!S.lib.active&&local.active)S.lib.active=local.active;
      S.sessions=sessSnap.docs.map(d=>normalizeSession(clone(d.data())));sortSessions();
      lsSet();
    }else{
      const hasLocal=S.lib.programs.length||S.lib.custom.length||S.sessions.length;
      if(hasLocal){const body=clone(S.lib);enqueue(()=>libRef.set(body));S.sessions.forEach(s=>saveSession(s))}
    }
    render(true);
  }catch(e){
    if(e&&e.code==='timeout')toast('Couldn’t reach your saved data yet — showing this device’s copy.');
    else dbErr(e);
  }
}

  if(!p||!p.startDate)return null;
  const t0=new Date(at||Date.now());t0.setHours(0,0,0,0);
  const raw=Math.max(1,Math.floor((t0.getTime()-isoToTime(p.startDate))/(7*864e5))+1);
  let week=raw,done=false,cycle=1;
  if(p.weeks&&raw>p.weeks){if(p.repeat){week=((raw-1)%p.weeks)+1;cycle=Math.floor((raw-1)/p.weeks)+1}else{week=p.weeks;done=true}}
  return {week,raw,total:p.weeks,deload:!done&&p.deloadWeeks.includes(week),done,cycle};
}
/* RIR target that ramps from ramp.from → ramp.to across each block between deloads; returns RPE */
function rampFor(p,w){
  if(!p||!p.ramp||!p.ramp.on||!w||p.deloadWeeks.includes(w))return null;
  const dl=p.deloadWeeks.slice().sort((a,b)=>a-b),prevD=dl.filter(x=>x<w).pop()||0,nextD=dl.find(x=>x>w);
  let start=prevD+1,end=nextD?nextD-1:p.weeks;
  if(!end){start=prevD+1+Math.floor((w-prevD-1)/4)*4;end=start+3}
  const pos=end>start?(w-start)/(end-start):1;
  return 10-Math.round((p.ramp.from+(p.ramp.to-p.ramp.from)*pos)*2)/2;
}
function weekLabel(p,w){if(!w)return 'Not started';if(w.done)return `Finished · ${p.weeks} weeks`;return `Week ${w.week}${w.total?' of '+w.total:''}${w.cycle>1?` · cycle ${w.cycle}`:''}`}
function setStartForWeek(p,week){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-7*(week-1));p.startDate=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function applyDeload(e,cfg,ex){
  ex=ex||getEx(e.exId);const work=e.sets.filter(s=>s.kind!=='W');
  if(e.nWork==null)e.nWork=work.length;
  const keep=Math.max(1,Math.round(e.nWork*cfg.sets));
  // drop extra un-ticked working sets from the end
  let count=work.length;for(let i=e.sets.length-1;i>=0&&count>keep;i--){const s=e.sets[i];if(s.kind!=='W'&&!s.done){e.sets.splice(i,1);count--}}
  const T=effT(e,ex),Td=Math.max(ex.type==='c'?2:5,T-cfg.rir),dk=distKey(ex);
  e.sets.forEach(s=>{if(s.done||s.kind==='W')return;s.t=s.t||{};
    if(ex.type==='c'){if(dk&&s.t[dk]!=null)s.t[dk]=dk==='distm'?Math.round(s.t[dk]*cfg.cardio):s.t[dk]*cfg.cardio;if(s.t.time!=null&&!(dk&&s.t[dk]!=null&&(e.runType==='Intervals'||e.runType==='Hills')))s.t.time=Math.round(s.t.time*cfg.cardio)}
    else if(s.t.weight)s.t.weight=floorW(s.t.weight*cfg.load,ex);
    if(s.t.reps&&e.repLo)s.t.reps=Math.min(s.t.reps,e.repLo);
    s.t.rpe=Td});
  e.deloaded=true;
  const bits=[keep<e.nWork?`${keep} of ${e.nWork} sets`:''];
  if(ex.type==='c')bits.push(`~${Math.round((1-cfg.cardio)*100)}% less volume`);else if(cfg.load<1&&ex.metrics.includes('weight'))bits.push(`${Math.round((1-cfg.load)*100)}% lighter`);
  bits.push(effTxt(Td,ex));
  e.sug={text:'Deload: '+bits.filter(Boolean).join(' · '),why:'Lighter week to recover and consolidate. Progression resumes next week from your last normal session.'};
}
function undoDeload(e,sessId){
  if(e.nWork!=null){let n=e.sets.filter(s=>s.kind!=='W').length;while(n<e.nWork){e.sets.push({id:gid(),kind:'N',v:{},t:{},done:false});n++}}
  e.deloaded=false;delete e.nWork;applySug(e,computeSug(e,sessId));
}

/* ============================== SMART PROGRESSION ============================== */
function incFor(ex){const i=U().inc[wu()]||{bar:5,db:5};return ['Dumbbell','Kettlebell'].includes(ex.equipment)?i.db:i.bar}
function roundW(kg,ex){const inc=incFor(ex);return wS(Math.round(wD(kg)/inc)*inc)}
function floorW(kg,ex){const inc=incFor(ex);return wS(Math.floor(wD(kg)/inc+1e-9)*inc)}
function defaultRange(ex){if(ex.type==='m')return [null,null];if(ex.type==='b')return [8,15];if(ex.type!=='s')return [null,null];return ['Barbell','Trap Bar'].includes(ex.equipment)?[5,8]:[8,12]}

function computeSug(e,excludeId){
  if(e.prog===false)return null;
  const ex=getEx(e.exId),M=ex.metrics,T=effT(e,ex);
  if(ex.type==='m')return null;
  if(ex.type==='c'){const last=lastPerf(e.exId,excludeId,e.runType||null);return last?cardioSug(e,ex,last.sets,T):null}
  const last=lastPerf(e.exId,excludeId);if(!last)return null;
  const work=last.sets.filter(s=>s.kind!=='W');if(!work.length)return null;
  const eff=avg(work.map(s=>effRpe(s.v)).filter(x=>x!=null))??T;
  const lo=e.repLo,hi=e.repHi;
  if(M.includes('reps')&&lo&&hi){
    const hasW=M.includes('weight')&&work.some(s=>s.v.weight>0);
    if(hasW){
      const topW=Math.max(...work.map(s=>s.v.weight||0)),top=work.filter(s=>(s.v.weight||0)===topW);
      const minR=Math.min(...top.map(s=>s.v.reps||0));
      const e1=Math.max(...work.map(s=>e1rmAdj(s.v.weight,s.v.reps,effRpe(s.v)??T)));
      let w,r,why;
      if(minR>=hi&&eff<=T+.5){
        r=lo;w=roundW(e1/(1+(lo+(10-T))/30),ex);const step=wS(incFor(ex));if(w<topW+step*.99)w=roundW(topW+step,ex);
        why=`You hit ${hi} reps on every set at or under target effort — add weight and restart at ${lo}.`;
      }else if(minR<lo||eff>=T+1.5){
        r=lo;w=(minR<lo&&eff>=9.5)?floorW(topW*.95,ex):topW;
        why=w<topW?`Missed the rep range at near-failure — back off ~5% and rebuild.`:minR<lo?`Fell short of ${lo} reps — repeat this weight.`:`Last time was harder than target (${effTxt(eff,ex)}) — repeat the weight.`;
      }else{r=Math.min(hi,minR+1);w=topW;why=`Same weight, beat last time by a rep (working toward ${hi}).`}
      return {t:{weight:w,reps:r,rpe:T},text:`${toDisp('weight',w)} ${wu()} × ${r} @ ${effTxt(T,ex)}`,why};
    }
    const minR=Math.min(...work.map(s=>s.v.reps||0));let r=minR,why;
    if(eff<=T+.5){r=minR+1;why=minR>=hi?`You're past ${hi} reps — consider adding load or a harder variation.`:'Effort was on target — add a rep to each set.'}
    else why='Effort was above target — repeat last reps.';
    return {t:{reps:r,rpe:T},text:`${r} reps @ ${effTxt(T,ex)}`,why};
  }
  if(M.includes('time')){const best=Math.max(...work.map(s=>s.v.time||0));if(!best)return null;const t=eff<=T+.5?best+5:best;
    return {t:{time:t,rpe:T},text:`${fmtTime(t)} @ ${effTxt(T,ex)}`,why:t>best?'Effort was on target — add 5 seconds per set.':'Effort was above target — repeat.'}}
  return null;
}
function cardioSug(e,ex,sets,T){
  const rt=e.runType||'',dk=distKey(ex),r=avg(sets.filter(s=>s.kind!=='W').map(s=>effRpe(s.v)).filter(x=>x!=null));
  let fd=1,ft=1,why;
  switch(rt){
    case 'Long':fd=(r==null||r<=6)?1.1:1;ft=fd;why=fd>1?'Build the long run ~10%. Keep it easy — conversational pace.':'Repeat this distance until it feels easy (RPE ≤ 6).';break;
    case 'Easy':case 'Recovery':why=`Same distance. Keep it truly easy (RPE ≤ ${RUN_RPE[rt]+1}) — don't chase pace.`;break;
    case 'Tempo':case 'Progression':ft=(r==null||r<=7.5)?.99:1;why=ft<1?'Same distance, ~1% faster — comfortably hard.':'Repeat this pace until it feels controlled (RPE ≤ 7).';break;
    case 'Intervals':case 'Fartlek':case 'Hills':ft=(r==null||r<=8.5)?.98:1;why=ft<1?'Same reps, aim ~2% faster on each.':'Effort was very high — repeat these splits.';break;
    case 'Race':return null;
    default:if(dk){fd=(r==null||r<=6)?1.05:1;ft=fd;why=fd>1?'Go ~5% further.':'Effort was high — repeat.'}else{ft=(r==null||r<=6)?1.05:1;why=ft>1?'Go ~5% longer.':'Effort was high — repeat.'}
  }
  const per=sets.map(s=>{const t={},warm=s.kind==='W';
    if(dk&&s.v[dk]!=null)t[dk]=warm?s.v[dk]:(dk==='distm'?Math.round(s.v[dk]*fd):s.v[dk]*fd);
    if(s.v.time!=null)t.time=Math.round(warm?s.v.time:s.v.time*ft);
    ex.metrics.forEach(m=>{if(t[m]==null&&s.v[m]!=null&&!['hr','calories'].includes(m))t[m]=s.v[m]});
    if(!warm)t.rpe=T;return {kind:s.kind||'N',t}});
  const main=per.filter(p=>p.kind!=='W');if(!main.length)return null;
  const td=sum(main.map(p=>p.t[dk]||0)),tt=sum(main.map(p=>p.t.time||0));
  const pc=dk?paceOf(ex,dk==='distance'?td:0,dk==='distm'?td:0,tt):null;
  let text;
  if(main.length===1)text=[dk&&td?toDisp(dk,td)+' '+unitLabel(dk):'',tt?fmtTime(tt):'',pc?`(${fmtTime(pc)}${paceUnit(ex)})`:''].filter(Boolean).join(' · ');
  else{const d0=main[0].t[dk],t0=main[0].t.time;text=`${main.length} × ${[d0?toDisp(dk,d0)+' '+unitLabel(dk):'',t0?fmtTime(t0):''].filter(Boolean).join(' in ')}`}
  return {perSet:per,text:text+` @ ${effTxt(T,ex)}`,why};
}
function applySug(e,sug){
  if(!sug){e.sug=null;return}
  if(sug.perSet){
    if(!e.sets.some(s=>s.done))e.sets=sug.perSet.map(p=>({id:gid(),kind:p.kind,v:{},t:clone(p.t),done:false}));
    else e.sets.forEach((s,i)=>{if(!s.done&&sug.perSet[i])s.t=clone(sug.perSet[i].t)});
  }else e.sets.forEach(s=>{if(!s.done&&(s.kind==='N'||s.kind==='F'))s.t=Object.assign({},s.t||{},clone(sug.t))});
  e.sug={text:sug.text,why:sug.why};
}

    ${pw&&!pw.deload&&ap.deloadWeeks.length&&!pw.done?(()=>{const nx=ap.deloadWeeks.filter(w=>w>pw.week).sort((a,b)=>a-b)[0];return nx?`<div class="xs" style="color:var(--mut2);margin-top:6px">Next deload: week ${nx}</div>`:''})():''}</div>

function nextWorkout(p){
  if(!p.workouts.length)return null;

}
function vProgram(pid){
  const p=S.lib.programs.find(x=>x.id===pid);if(!p)return topbar('Program')+'<div class="empty">Program not found.</div>';
  const isActive=S.lib.settings.activeProgram===p.id;
  let h=topbar('',{right:`<button class="icon-btn" data-a="program-menu" data-pid="${p.id}">${I.more}</button>`});
  h+=`<div class="row" style="margin-bottom:4px;--pc:${p.color}"><span class="pdot" style="background:${p.color};width:12px;height:12px"></span><div class="big-title grow" style="margin:0">${esc(p.name)}</div><button class="icon-btn" data-a="rename-program" data-pid="${p.id}">${I.edit}</button></div>
  <input class="note-inp" style="font-size:14px;margin:6px 0 10px" placeholder="Add a description (e.g. 4 days/week, hypertrophy)" value="${esc(p.description||'')}" data-c="prog-desc" data-pid="${p.id}">
  <button class="btn ${isActive?'sec2':''} sm" data-a="set-active" data-pid="${p.id}">${isActive?'✓ Active program':'Set as active program'}</button>
  <div class="sec">Color</div><div class="card" style="padding:12px 16px"><div class="swatches" style="margin:0">${MORANDI.map(([n,c])=>`<button class="sw ${p.color===c?'on':''}" style="background:${c}" title="${n}" aria-label="${n}" data-a="prog-color" data-pid="${p.id}" data-k="${c}"></button>`).join('')}</div></div>
  ${scheduleCard(p)}
  <div class="sec">Workouts <button data-a="add-workout" data-pid="${p.id}">+ Add</button></div>`;
  if(!p.workouts.length)h+=`<div class="card empty"><div class="sm">Add workouts (e.g. Push, Pull, Legs, Long Run) to this program.</div><div style="height:12px"></div><button class="btn" data-a="add-workout" data-pid="${p.id}">Add workout</button></div>`;
  p.workouts.forEach((w,i)=>{
    const sets=w.exercises.reduce((a,e)=>a+e.sets.length,0);
    h+=`<div class="card tap" data-a="open-workout" data-pid="${p.id}" data-wid="${w.id}">
      <div class="row"><div class="avatar" style="background:${p.color};color:#fff">${i+1}</div><div class="grow"><div class="b ell">${esc(w.name)}</div><div class="sub">${w.exercises.length} exercises · ${sets} sets</div></div>
      <button class="icon-btn" style="background:transparent" data-a="workout-menu" data-pid="${p.id}" data-wid="${w.id}">${I.more}</button></div>
      ${w.exercises.length?`<div class="sm m" style="margin-top:10px;line-height:1.6">${w.exercises.map(e=>{const ex=getEx(e.exId);return `${e.sets.length} × ${esc(ex.name)}${e.repLo&&e.repHi?` <span style="color:var(--mut2)">· ${e.repLo}–${e.repHi}</span>`:''}${e.runType?` <span style="color:var(--blue)">· ${esc(e.runType)}</span>`:''}`}).join('<br>')}</div>`:''}
      <button class="btn sm full" style="margin-top:12px" data-a="start-tpl" data-pid="${p.id}" data-wid="${w.id}">Start workout</button>
    </div>`});
  return h;
}

/* shared exercise block pieces */
function progLine(e,ei,ex){
  if(ex.type==='m')return `<div class="prog-line"><span class="pchip" style="background:var(--ok-soft);color:var(--ok)">Stretches: ${esc(ex.primary.join(', ')||'—')}</span></div>`;
  const T=effT(e,ex);let h='<div class="prog-line">';
  if(ex.type==='c')h+=`<select class="mini-sel" style="color:var(--blue);background:var(--blue-soft)" data-c="runtype" data-ei="${ei}"><option value="">Type: none</option>${RUN_TYPES.map(t=>`<option ${e.runType===t?'selected':''}>${t}</option>`).join('')}</select>`;
  const range=e.repLo&&e.repHi&&ex.metrics.includes('reps')?`${e.repLo}–${e.repHi} reps · `:'';
  h+=`<button class="pchip ${e.prog===false?'off':''}" data-a="prog-edit" data-ei="${ei}">${range}target ${esc(effTxt(T,ex))}${e.tRpe==null&&e.rampT!=null?' · ramp':''}${e.prog===false?' · progression off':' · auto'}</button>`;
  return h+'</div>';
}
function sugBox(s){return s?`<div class="sug"><div class="grow"><b>${esc(s.text)}</b><span>${esc(s.why)}</span></div></div>`:''}
function exBlockHeader(ex,e,ei,mode){
  return `<div class="exb-h">${avatar(ex)}<div class="grow"><div class="nm ell" data-a="open-ex" data-id="${ex.id}">${esc(ex.name)}</div><div class="chips" style="margin-top:3px">${muscleChips(ex,4)}</div></div>
  ${mode==='sess'?`<button class="icon-btn" style="background:transparent;width:32px;font-size:18px;color:var(--mut)" data-a="swap" data-ei="${ei}" title="Swap exercise">⇄</button>`:''}<button class="icon-btn" style="background:transparent;width:32px" data-a="ex-menu" data-ei="${ei}">${I.more}</button></div>
  ${mode==='sess'&&e.swappedFrom?`<div class="prog-line"><button class="pchip" style="background:var(--blue-soft);color:var(--blue)" data-a="swap-back" data-ei="${ei}">⇄ Swapped from ${esc(getEx(e.swappedFrom).name)} · undo</button></div>`:''}
  <div class="exb-meta"><select class="mini-sel" data-c="rest" data-ei="${ei}">${[0,30,45,60,90,120,150,180,240,300].map(s=>`<option value="${s}" ${+(e.rest??0)===s?'selected':''}>${s?'Rest '+fmtTime(s):'No rest timer'}</option>`).join('')}</select>

const gridCols=(n,showPrev)=>`grid-template-columns:34px ${showPrev?'minmax(52px,1.15fr) ':''}repeat(${n},minmax(42px,1fr)) 40px`;
function setLabel(sets,si){const k=sets[si].kind||'N';if(k!=='N')return k;let n=0;for(let i=0;i<=si;i++)if((sets[i].kind||'N')==='N')n++;return n}

function vWorkout(pid,wid){
  const p=S.lib.programs.find(x=>x.id===pid),w=p&&p.workouts.find(x=>x.id===wid);
  if(!w)return topbar('Workout')+'<div class="empty">Workout not found.</div>';
  let h=topbar(esc(p.name),{right:`<button class="icon-btn" data-a="workout-menu" data-pid="${pid}" data-wid="${wid}">${I.more}</button>`});
  h+=`<div class="row" style="margin-bottom:14px"><div class="big-title grow" style="margin:0">${esc(w.name)}</div><button class="icon-btn" data-a="rename-workout" data-pid="${pid}" data-wid="${wid}">${I.edit}</button></div>
  <div class="sub" style="margin:-6px 2px 14px">Set rep ranges and effort targets. With auto progression on, each session's targets come from your last performance; the boxes below are the fallback for the first time.</div>`;
  if(!w.exercises.length)h+=`<div class="card empty"><div class="sm">No exercises yet.</div></div>`;
  const pwk=progWeek(p),rtNow=rampFor(p,pwk&&!pwk.done?pwk.week:1);
  w.exercises.forEach((e,ei)=>{
    const ex=getEx(e.exId),M=ex.metrics;e.rampT=ex.type!=='c'?rtNow:null;
    h+=`<div class="exb">${exBlockHeader(ex,e,ei,'tpl')}${sugBox(computeSug(e,null))}
    <div class="sets-h" style="${gridCols(M.length,false)}"><div>Set</div>${M.map(m=>`<div>${esc(unitLabel(m))}</div>`).join('')}<div></div></div>
    ${e.sets.map((st,si)=>`<div class="set-r" style="${gridCols(M.length,false)}">
      <button class="set-n ${st.kind||'N'}" data-a="set-menu" data-ei="${ei}" data-si="${si}">${setLabel(e.sets,si)}</button>
      ${M.map(m=>`<input class="cell" inputmode="${m==='time'?'text':'decimal'}" placeholder="${m==='time'?'m:ss':'–'}" value="${esc(toDisp(m,st.v?.[m]))}" data-c="setv" data-ei="${ei}" data-si="${si}" data-m="${m}">`).join('')}
      <button class="ck" data-a="del-set" data-ei="${ei}" data-si="${si}" title="Remove set">${I.x}</button></div>`).join('')}
    <button class="add-set" data-a="add-set" data-ei="${ei}">+ Add set</button></div>`});
  h+=`<div class="row"><button class="btn sec2 grow" data-a="pick" data-target="tpl">${I.plus} Add exercises</button><button class="btn sec2" data-a="mob-quick">+ Mobility</button></div>
  <div style="height:10px"></div><button class="btn full" data-a="start-tpl" data-pid="${pid}" data-wid="${wid}" ${w.exercises.length?'':'disabled'}>Start this workout</button>`;
  return h;
}

function scheduleCard(p){
  const pw=progWeek(p),n=p.weeks||Math.max(12,(pw?pw.week:0)+4),D=p.deload,pct=x=>Math.round(x*100);
  const sel=(c,opts,v)=>`<select class="mini-sel" data-c="${c}" data-pid="${p.id}">${opts.map(([val,l])=>`<option value="${val}" ${Math.abs(val-v)<1e-6?'selected':''}>${l}</option>`).join('')}</select>`;
  return `<div class="sec">Schedule</div><div class="card" style="--pc:${p.color}">
  <div class="row"><div class="grow"><div class="b">Length</div><div class="sub">${p.weeks?'Fixed-length block':'Ongoing — no end week'}</div></div>
    <div class="stepper"><button data-a="weeks-adj" data-pid="${p.id}" data-k="-1">−</button><div class="v">${p.weeks?p.weeks+' weeks':'Ongoing'}</div><button data-a="weeks-adj" data-pid="${p.id}" data-k="1">+</button></div></div>
  <div class="mini-row"><span>${pw?esc(weekLabel(p,pw)):'Not started'}${pw&&pw.deload?' · <b style="color:var(--purple)">Deload</b>':''}</span>
    <span class="row" style="gap:6px">${pw?`<button class="btn sm sec2" data-a="set-week" data-pid="${p.id}">Change week</button>`:''}<button class="btn sm ${pw?'sec2':''}" data-a="prog-restart" data-pid="${p.id}">${pw?'Restart':'Start week 1 today'}</button></span></div>
  ${pw?`<div class="xs" style="color:var(--mut2);margin-top:-2px">Started ${fmtDate(isoToTime(p.startDate),{month:'short',day:'numeric',year:'numeric'})}</div>`:''}
  ${p.weeks?`<label class="mini-row" style="cursor:pointer"><span>Repeat when finished</span><input type="checkbox" data-c="prog-repeat" data-pid="${p.id}" ${p.repeat?'checked':''} style="width:20px;height:20px;accent-color:var(--acc)"></label>`:''}
  <div class="b" style="margin-top:10px">Weeks <span class="sub" style="font-weight:500">— tap to mark deload weeks</span></div>
  <div class="wkgrid">${Array.from({length:n},(_,i)=>{const w=i+1,dl=p.deloadWeeks.includes(w);return `<button class="wchip ${dl?'dl':''} ${pw&&!pw.done&&pw.week===w?'cur':''} ${pw&&!pw.done&&w<pw.week?'past':''}" data-a="wk-toggle" data-pid="${p.id}" data-w="${w}"><span>${w}</span><small>${dl?'DELOAD':rampFor(p,w)!=null?fmt(10-rampFor(p,w),1)+' RIR':pw&&!pw.done&&pw.week===w?'NOW':''}</small></button>`}).join('')}</div>
  <div class="filters" style="margin:0 0 4px">${[['4','Every 4th'],['5','Every 5th'],['6','Every 6th'],['last','Final week'],['none','Clear']].map(([k,l])=>`<button class="fchip" style="background:var(--card2)" data-a="wk-preset" data-pid="${p.id}" data-k="${k}">${l}</button>`).join('')}</div>
  <div class="b" style="margin-top:10px">Smart effort ramp</div>
  <label class="mini-row" style="cursor:pointer"><span>Ramp RIR/RPE targets across each block<div class="xs" style="color:var(--mut2);font-weight:400">Start easier, finish close to failure, then deload</div></span><input type="checkbox" data-c="ramp-on" data-pid="${p.id}" ${p.ramp.on?'checked':''} style="width:20px;height:20px;accent-color:var(--acc)"></label>
  ${p.ramp.on?`<div class="mini-row"><span>First week of block</span>${sel('ramp-from',[4,3.5,3,2.5,2,1.5,1].map(r=>[r,`${r} RIR · RPE ${10-r}`]),p.ramp.from)}</div>
  <div class="mini-row"><span>Last week before deload</span>${sel('ramp-to',[3,2.5,2,1.5,1,0.5,0].map(r=>[r,`${r} RIR · RPE ${10-r}`]),p.ramp.to)}</div>
  <div class="xs" style="color:var(--mut2)">Applies to lifts whose target is set to Auto. Smart progression sizes the weight to hit that week's target.</div>`:''}
  <div class="b" style="margin-top:10px">During deload weeks</div>
  <div class="mini-row"><span>Working sets</span>${sel('dl-sets',[[1,'Keep all'],[.75,'Cut 25%'],[.67,'Cut ⅓'],[.5,'Cut 50%'],[.4,'Cut 60%']],D.sets)}</div>
  <div class="mini-row"><span>Weight</span>${sel('dl-load',[[1,'Same'],[.95,'−5%'],[.9,'−10%'],[.85,'−15%'],[.8,'−20%'],[.7,'−30%']],D.load)}</div>
  <div class="mini-row"><span>Effort</span>${sel('dl-rir',[[1,'+1 RIR (−1 RPE)'],[2,'+2 RIR (−2 RPE)'],[3,'+3 RIR (−3 RPE)'],[4,'+4 RIR (−4 RPE)']],D.rir)}</div>
  <div class="mini-row"><span>Run / cardio volume</span>${sel('dl-cardio',[[1,'Same'],[.8,'−20%'],[.7,'−30%'],[.6,'−40%'],[.5,'−50%']],D.cardio)}</div>

function livePace(ex,st,pv){const g=m=>st.v?.[m]??st.t?.[m]??pv?.v?.[m];const p=paceOf(ex,g('distance')||0,g('distm')||0,g('time'));return p?fmtTime(p):'–'}
function getSess(){const t=cur();return t.sid?S.editing:S.lib.active}
function vSession(){
  const s=getSess();if(!s)return topbar('Workout')+'<div class="empty">No workout in progress.</div>';
  const editing=!!cur().sid;
  let h=`<div class="top"><button class="icon-btn" data-a="back">${editing?I.back:I.down}</button>
    <div class="ttl" style="cursor:pointer" data-a="rename-sess">${esc(s.name)} <span class="m" style="font-weight:500">✎</span><div class="elapsed" id="sess-el">${fmtDate(s.startedAt,{month:'short',day:'numeric'})} · ${editing?fmtMin(durOf(s)):sessTimeLabel(s)}</div></div>
    <button class="btn ${editing?'':'ok'} sm" data-a="${editing?'save-edit':'finish'}">${editing?'Save':'Finish'}</button></div>`;
  const measured=!s.timeEdited&&!editing?Math.round((Date.now()-s.startedAt)/60000):null;
  h+=`<div class="card" style="padding:12px 14px"><div class="row" style="gap:8px;align-items:flex-end">
    <label class="grow" style="min-width:0"><div class="xs m" style="margin-bottom:4px">Date</div><input type="date" class="inp" style="height:40px;padding:0 8px" value="${toDateInput(s.startedAt)}" data-c="sess-date"></label>
    <label style="width:122px"><div class="xs m" style="margin-bottom:4px">Start</div><input type="time" class="inp" style="height:40px;padding:0 8px" value="${toTimeInput(s.startedAt)}" data-c="sess-time"></label>
    <label style="width:84px"><div class="xs m" style="margin-bottom:4px">Duration</div><input class="inp" style="height:40px;padding:0 10px;font-weight:600" inputmode="text" placeholder="${editing?Math.round(durOf(s)/60000):'min'}" value="${s.durMin!=null?s.durMin:''}" data-c="sess-dur"></label></div>
    <div class="xs" style="color:var(--mut2);margin-top:6px">Type minutes (60) or h:mm (1:05).${measured!=null?' Leave blank to use the live timer.':''}</div></div>`;
  const pc=progColor(s.programId),pn=s.programId&&findProg(s.programId);
  h+=`<div class="prog-line" style="margin:-2px 0 12px">${pn?`<span class="pchip"><span class="pdot" style="background:${pc}"></span>${esc(pn.name)}</span>`:''}${s.week?`<span class="pchip">Week ${s.week}</span>`:''}<button class="pchip ${s.deload?'':'off'}" style="${s.deload?'background:var(--purple-soft);color:var(--purple)':''}" data-a="sess-deload">${s.deload?'✓ Deload':'Mark as deload'}</button></div>`;
  if(!s.exercises.length)h+=`<div class="card empty"><div class="sm">Add your first exercise to get going.</div></div>`;
  s.exercises.forEach((e,ei)=>{
    const ex=getEx(e.exId),M=ex.metrics,prev=prevSets(e.exId,s.id,e.runType,!!s.deload),EC=effCols(e,ex),hasPace=ex.type==='c'&&!!distKey(ex)&&M.includes('time'),
      showPrev=M.length+EC.length+(hasPace?1:0)<=3,cols=M.length+EC.length+(hasPace?1:0),T=effT(e,ex);
    h+=`<div class="exb">${exBlockHeader(ex,e,ei,'sess')}${editing?'':sugBox(e.sug)}
    <div class="sets-h" style="${gridCols(cols,showPrev)}"><div>Set</div>${showPrev?'<div>Previous</div>':''}${M.map(m=>`<div>${esc(unitLabel(m))}</div>`).join('')}${hasPace?`<div>Pace</div>`:''}${EC.map(c=>`<div>${c.toUpperCase()}</div>`).join('')}<div>✓</div></div>
    ${e.sets.map((st,si)=>{const pv=prev[si]||null;
      return `<div class="set-r ${st.done?'done':''} ${cols>=5?'tight':''}" style="${gridCols(cols,showPrev)}">
      <button class="set-n ${st.kind||'N'}" data-a="set-menu" data-ei="${ei}" data-si="${si}">${setLabel(e.sets,si)}</button>
      ${showPrev?`<div class="prev ${pv?'tap':''}" ${pv?`data-a="use-prev" data-ei="${ei}" data-si="${si}"`:''}>${pv?esc(prevShort(ex,pv.v)):'—'}</div>`:''}
      ${M.map(m=>{const ph=st.t?.[m]!=null?toDisp(m,st.t[m]):(pv&&pv.v?.[m]!=null?toDisp(m,pv.v[m]):(m==='time'?'m:ss':'–'));
        return `<input class="cell" inputmode="${m==='time'?'text':'decimal'}" placeholder="${esc(ph)}" value="${esc(toDisp(m,st.v?.[m]))}" data-c="setv" data-ei="${ei}" data-si="${si}" data-m="${m}">`}).join('')}
      ${hasPace?`<div class="prev" id="pace-${ei}-${si}" style="font-weight:700;color:${st.done?'var(--text)':'var(--mut2)'}">${esc(livePace(ex,st,pv))}</div>`:''}
      ${EC.map(c=>{const tr=st.kind==='W'?null:(st.t?.rpe??T);let ph;
        if(c==='rir')ph=st.v?.rpe!=null?fmt(10-st.v.rpe,1):(tr!=null?fmt(10-tr,1):'–');else ph=st.v?.rir!=null?fmt(10-st.v.rir,1):(tr!=null?fmt(tr,1):'–');
        return `<input class="cell" inputmode="decimal" placeholder="${esc(ph)}" value="${st.v?.[c]!=null?esc(fmt(st.v[c],1)):''}" data-c="setv" data-ei="${ei}" data-si="${si}" data-m="${c}">`}).join('')}
      <button class="ck" data-a="check" data-ei="${ei}" data-si="${si}">${I.check}</button></div>`}).join('')}
    <button class="add-set" data-a="add-set" data-ei="${ei}">+ Add set</button></div>`});
  h+=`<div class="row"><button class="btn sec2 grow" data-a="pick" data-target="sess">${I.plus} Add exercise</button><button class="btn sec2" data-a="mob-quick">+ Mobility</button></div>
  <textarea class="inp" style="margin-top:12px" placeholder="Workout notes" data-c="sess-note">${esc(s.notes||'')}</textarea>
  <div class="kbd-hint">Grey numbers are your targets — tick ✓ to accept them, or type what you actually did. RIR = reps left in the tank (0 = failure). RPE = how hard it felt, 1–10 (8 ≈ 2 reps left). Log either or both. Tap a set number to mark warm-up / drop / failure sets.</div>
  <div style="height:16px"></div>${editing?`<button class="btn danger full" data-a="del-session" data-sid="${s.id}">Delete workout</button>`:`<button class="btn danger full" data-a="discard">Discard workout</button>`}`;
  return h;
}

/* ============================== VIEWS: LIBRARY ============================== */
function filterEx(f){
  const q=f.q.trim().toLowerCase();
  return allEx().filter(e=>{
    if(f.type==='custom'&&e.builtin)return false;
    if(['s','b','c','t','m'].includes(f.type)&&e.type!==f.type)return false;
    if(f.muscle&&!e.primary.includes(f.muscle)&&!e.secondary.includes(f.muscle))return false;
    if(q&&!(e.name.toLowerCase().includes(q)||e.primary.join(' ').toLowerCase().includes(q)||(e.equipment||'').toLowerCase().includes(q)))return false;
    return true}).sort((a,b)=>{
      if(q){const sc=e=>{const n=e.name.toLowerCase();return n.startsWith(q)?0:new RegExp('\\b'+q.replace(/[^a-z0-9]/g,'')).test(n)?1:n.includes(q)?2:3};const d=sc(a)-sc(b);if(d)return d}
      return a.name.localeCompare(b.name)});
}
function filterBar(f,key){
  return `<div class="search">${I.search}<input class="inp" id="${key}-q" placeholder="Search exercises, muscles, equipment" value="${esc(f.q)}" data-c="${key}-q" autocomplete="off"></div>
  ${chipsRow([['all','All'],['s','Strength'],['b','Bodyweight'],['c','Cardio'],['t','Timed'],['m','Mobility'],['custom','My exercises']],f.type,key+'-type')}
  <select class="inp" style="margin-bottom:12px;height:40px" data-c="${key}-muscle"><option value="">All muscles</option>${MUSCLES.map(m=>`<option ${f.muscle===m?'selected':''}>${m}</option>`).join('')}</select>`;
}
function swapScore(a,from){let s=0;if(a.type===from.type)s+=3;a.primary.forEach(m=>{if(from.primary.includes(m))s+=2;else if(from.secondary.includes(m))s+=.5});if(a.equipment===from.equipment)s+=.5;
  a.secondary.forEach(m=>{if(from.secondary.includes(m)||from.primary.includes(m))s+=.5});
  const w=n=>n.toLowerCase().split(/[^a-z]+/).filter(x=>x.length>=3&&!['the','and','with'].includes(x));const fw=w(from.name);w(a.name).forEach(x=>{if(fw.includes(x))s+=3});return s}
function pickList(){
  let list=filterEx(S.pick);
  if(S.pick.swap){const from=getEx(S.pick.swap.from);list=list.filter(x=>x.id!==from.id);if(!S.pick.q.trim())list=list.map(x=>[x,swapScore(x,from)]).sort((a,b)=>b[1]-a[1]||a[0].name.localeCompare(b[0].name)).map(x=>x[0])}
  if(!list.length)return `<div class="empty sm">No matches. <a href="#" data-a="new-ex" style="color:var(--acc)">Create “${esc(S.pick.q)}”</a></div>`;
  return `<div class="list">${list.map(e=>{const on=S.pick.sel.includes(e.id);
    return `<div class="list-item" style="cursor:pointer" data-a="pick-toggle" data-id="${e.id}">${avatar(e)}<div class="grow"><div class="b ell">${esc(e.name)}</div><div class="sub ell">${esc(e.primary.join(', '))}${e.equipment?' · '+esc(e.equipment):''}</div></div>${S.pick.swap?'<span class="m">⇄</span>':`<div class="check ${on?'on':''}">${I.check}</div>`}</div>`}).join('')}</div>`;
}

/* ============================== ANALYTICS ============================== */
const RANGES={'4w':28,'12w':84,'6m':182,'1y':365,'all':null};
const rangeFrom=k=>RANGES[k]?Date.now()-RANGES[k]*864e5:0;
function exHistory(exId,rt){const out=[];S.sessions.forEach(s=>s.exercises.forEach(e=>{if(e.exId===exId&&(!rt||rt==='all'||e.runType===rt)){const d=e.sets.filter(x=>x.done);if(d.length)out.push({s,e,sets:d})}}));return out}
function exSessMetrics(ex,sets){
  const w=sets.filter(s=>s.kind!=='W'),m={};
  m.e1=Math.max(0,...w.map(s=>e1rmAdj(s.v.weight,s.v.reps,effRpe(s.v))));
  m.topW=Math.max(0,...w.map(s=>s.v.weight||0));
  m.load=sum(sets.map(s=>(s.v.weight||0)*(s.v.reps||0)));
  m.reps=sum(sets.map(s=>s.v.reps||0));
  m.bestReps=Math.max(0,...w.map(s=>s.v.reps||0));
  m.eff=avg(w.map(s=>effRpe(s.v)).filter(x=>x!=null));
  const dk=sum(sets.map(s=>s.v.distance||0)),dm=sum(sets.map(s=>s.v.distm||0));
  m.distKm=dk;m.distM=dm;m.dist=ex.metrics.includes('distance')?dk:dm;
  m.time=sum(sets.map(s=>s.v.time||0));m.bestTime=Math.max(0,...w.map(s=>s.v.time||0));
  const wd=sum(w.map(s=>s.v.distance||0)),wm=sum(w.map(s=>s.v.distm||0)),wt=sum(w.filter(s=>(s.v.distance||s.v.distm)).map(s=>s.v.time||0));
  m.pace=paceOf(ex,wd,wm,wt);
  m.hr=avg(sets.map(s=>s.v.hr).filter(Boolean));
  m.sets=w.length;
  return m;
}
function exMetricOpts(ex,hist){
  const has=k=>hist.some(h=>{const v=exSessMetrics(ex,h.sets)[k];return v!=null&&v>0});
  let o;
  if(ex.type==='m')o=[['time','Total time'],['bestTime','Longest hold'],['reps','Total reps'],['sets','Sets']];
  else if(ex.type==='c')o=[['dist','Distance'],['time','Duration'],['pace','Pace'],...(ex.metrics.includes('weight')?[['topW','Pack weight']]:[]),['hr','Heart rate'],['eff','Effort']];
  else if(ex.metrics.includes('weight'))o=[['e1','Est. 1RM'],['topW','Top weight'],['load','Total load'],['reps','Total reps'],['eff','Effort']];
  else if(ex.metrics.includes('reps'))o=[['bestReps','Best set'],['reps','Total reps'],['eff','Effort']];
  else if(ex.metrics.includes('time'))o=[['bestTime','Longest set'],['time','Total time'],['eff','Effort']];
  else o=[['sets','Sets'],['eff','Effort']];
  const f=o.filter(([k])=>has(k));return f.length?f:o.slice(0,1);
}
function mVal(k,v,ex){if(v==null)return null;switch(k){case 'e1':case 'topW':case 'load':return wD(v);case 'dist':return ex.metrics.includes('distance')?dD(v):v;case 'eff':return scaleOf(ex)==='rir'?10-v:v;default:return v}}
function mFmt(k,y,ex){switch(k){
  case 'e1':case 'topW':return fmt(y,1)+' '+wu();case 'load':return big(y)+' '+wu();
  case 'reps':case 'bestReps':return fmt(y,0)+' reps';case 'dist':return ex.metrics.includes('distance')?fmt(y,2)+' '+du():fmt(y,0)+' m';
  case 'time':case 'bestTime':return fmtTime(y);case 'pace':return fmtTime(y)+paceUnit(ex);case 'hr':return fmt(y,0)+' bpm';
  case 'sets':return fmt(y,0)+' sets';
  case 'eff':return (scaleOf(ex)==='rir'?'':'RPE ')+fmt(y,1)+(scaleOf(ex)==='rir'?' RIR':'');default:return fmt(y,1)}}
const lowerBetter=k=>k==='pace';
function deltaHtml(a,b,k,ex){
  if(a==null||b==null||!a)return '';
  if(k==='eff'){const d=b-a;return `<span class="delta fl">${d>=0?'+':''}${fmt(d,1)} ${effLabel(ex)}</span>`}
  let pct=(b-a)/a*100;const good=lowerBetter(k)?pct<0:pct>0;
  if(Math.abs(pct)<.5)return `<span class="delta fl">±0%</span>`;
  return `<span class="delta ${good?'up':'dn'}">${good?'▲':'▼'} ${fmt(Math.abs(pct),1)}%</span>`;
}
function lineChart(pts,f,lower){
  if(pts.length<2)return `<div class="sub" style="padding:18px 0;text-align:center">${pts.length?'Log this again to see a trend.':'No data in this range.'}</div>`;
  pts=pts.slice().sort((a,b)=>a.t-b.t);
  const all=pts;pts=pts.filter(p=>!p.d);const drawLine=pts.length>=2;if(!pts.length)pts=all;
  const W=340,H=160,pl=8,pr=8,pt=20,pb=22;
  const xs=all.map(p=>p.t),ys=all.map(p=>p.y);let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  if(x1===x0)x1=x0+1;const pad=(y1-y0)*.18||Math.abs(y1)*.1||1;y0-=pad;y1+=pad;
  const X=t=>pl+(t-x0)/(x1-x0)*(W-pl-pr),Y=y=>pt+(1-(y-y0)/(y1-y0))*(H-pt-pb);
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(p.t).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area=line+`L${X(pts[pts.length-1].t).toFixed(1)},${H-pb}L${X(pts[0].t).toFixed(1)},${H-pb}Z`;
  const best=pts.reduce((a,b)=>(lower?b.y<a.y:b.y>a.y)?b:a),last=all[all.length-1];
  const bx=Math.max(30,Math.min(W-30,X(best.t)));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".28"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>
  ${drawLine?`<path d="${area}" fill="url(#g)"/><path d="${line}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:''}
  ${all.map(p=>`<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${p.d?3.5:3}" fill="var(--card)" stroke="${p.d?'var(--purple)':'var(--acc)'}" stroke-width="2" ${p.d?'stroke-dasharray="2 1.5"':''}/>`).join('')}
  <text x="${bx}" y="${Math.max(11,Y(best.y)-8)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--text)">Best ${esc(f(best.y))}</text>
  <text x="${pl}" y="${H-6}" font-size="10" fill="var(--mut2)">${fmtDate(all[0].t,{month:'short',day:'numeric'})}</text>
  <text x="${W-pr}" y="${H-6}" font-size="10" fill="var(--mut2)" text-anchor="end">${fmtDate(last.t,{month:'short',day:'numeric'})}</text></svg>`;
}
function colChart(items,f){
  const mx=Math.max(...items.map(i=>i.v),0)||1,every=Math.ceil(items.length/9);
  return `<div class="cols">${items.map((it,i)=>`<div class="c" title="${esc(it.label+': '+f(it.v))}"><span style="color:var(--text)">${it.v&&items.length<=12?esc(f(it.v,true)):''}</span><div class="${it.v?(it.dl?'dl':''):'z'}" style="height:${it.v/mx*72}%"></div><span>${i%every===0||i===items.length-1?esc(it.label):'&nbsp;'}</span></div>`).join('')}</div>`;
}

function weekStart(off){const d=new Date();d.setHours(0,0,0,0);const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow-7*off);return d.getTime()}
function aggregate(list){const r={n:list.length,sets:0,load:0,dist:0,dur:0,cardio:0,muscles:{},runTypes:{},mob:{n:0,sets:0,time:0,muscles:{}}};
  list.forEach(s=>{const t=summarize(s);r.sets+=t.sets;r.load+=t.load;r.dist+=t.dist;r.dur+=t.dur;r.cardio+=t.cardioTime;
    Object.entries(t.muscles).forEach(([m,o])=>{const x=r.muscles[m]=r.muscles[m]||{sets:0,load:0};x.sets+=o.sets;x.load+=o.load});
    if(t.mob.sets){r.mob.n++;r.mob.sets+=t.mob.sets;r.mob.time+=t.mob.time;Object.entries(t.mob.muscles).forEach(([m,o])=>{const x=r.mob.muscles[m]=r.mob.muscles[m]||{sets:0,time:0};x.sets+=o.sets;x.time+=o.time})}
    Object.entries(t.runTypes).forEach(([k,o])=>{const x=r.runTypes[k]=r.runTypes[k]||{dist:0,time:0,n:0};x.dist+=o.dist;x.time+=o.time;x.n++})});return r}
function topMuscles(t,n){return Object.entries(t.muscles).sort((a,b)=>b[1].sets-a[1].sets).slice(0,n).map(([m])=>m)}
function vHistory(){

  const a=weekStart(0),wk=aggregate(S.sessions.filter(s=>s.startedAt>=a));
  h+=`<div class="sub b" style="margin:0 2px 8px">THIS WEEK</div><div class="stats"><div class="stat"><div class="v">${wk.n}</div><div class="l">Workouts</div></div><div class="stat"><div class="v">${fmtMin(wk.dur)}</div><div class="l">Training time</div></div>
  <div class="stat"><div class="v">${big(wD(wk.load))}</div><div class="l">${wu()} total load</div></div><div class="stat"><div class="v">${fmt(dD(wk.dist),1)}</div><div class="l">${du()} covered</div></div></div>`;
  let lastMonth='';
  S.sessions.forEach(s=>{
    const mo=new Date(s.startedAt).toLocaleDateString(undefined,{month:'long',year:'numeric'});
    if(mo!==lastMonth){h+=`<div class="sec">${mo}</div>`;lastMonth=mo}
    const st=summarize(s);
    const bits=[fmtMin(st.dur),st.sets+' sets'];if(st.load)bits.push(big(wD(st.load))+' '+wu());if(st.dist)bits.push(fmt(dD(st.dist),2)+' '+du());if(st.eff!=null)bits.push('avg '+effTxt(st.eff,null));

function improvements(from){
  const ids={};S.sessions.forEach(s=>{if(s.startedAt<from||s.deload)return;s.exercises.forEach(e=>{if(e.sets.some(x=>x.done))(ids[e.exId]=ids[e.exId]||new Set()).add(e.runType||'')})});
  const out=[];
  Object.entries(ids).forEach(([id,rtSet])=>{const ex=getEx(id);
    const groups=ex.type==='c'?[...rtSet]:[''];
    groups.forEach(rt=>{
      const hist=exHistory(id,ex.type==='c'?(rt||null):null).filter(x=>x.s.startedAt>=from&&!x.s.deload&&(ex.type!=='c'||(x.e.runType||'')===rt));
      if(hist.length<2)return;
      const key=ex.type==='c'?'pace':ex.metrics.includes('weight')?'e1':ex.metrics.includes('reps')?'bestReps':ex.metrics.includes('time')?'bestTime':null;if(!key)return;
      const pts=hist.map(x=>({t:x.s.startedAt,y:exSessMetrics(ex,x.sets)[key]})).filter(p=>p.y).sort((a,b)=>a.t-b.t);
      let k2=key;let P=pts;
      if(ex.type==='c'&&P.length<2){k2=ex.metrics.includes('distance')||ex.metrics.includes('distm')?'dist':'time';P=hist.map(x=>({t:x.s.startedAt,y:exSessMetrics(ex,x.sets)[k2]})).filter(p=>p.y).sort((a,b)=>a.t-b.t)}
      if(P.length<2)return;
      const a=P[0].y,b=P[P.length-1].y;let pct=(b-a)/a*100;if(lowerBetter(k2))pct=-pct;
      out.push({id,ex,rt,key:k2,a,b,pct,n:P.length});
    })});
  return out.sort((x,y)=>y.pct-x.pct);
}

  ${mrows.length?hbars(mrows.map(([m,o])=>[m,P.mus==='sets'?o.sets/nWeeks:wD(o.load)]).sort((a,b)=>b[1]-a[1]),P.mus==='sets'?v=>fmt(v,1):v=>big(v)):'<div class="sub">No strength sets in this range.</div>'}</div>`;

  return h;
}

      else{const k=+d.k;p.deloadWeeks=[];for(let w=k;w<=n;w+=k)p.deloadWeeks.push(w)}
      saveLib();render(true);break}
    case 'prog-restart':{const p=findProg(d.pid);const go2=()=>{p.startDate=todayISO();saveLib();render(true);toast('Week 1 starts today')};
      if(p.startDate)confirmSheet('Restart program?','Week 1 will start today. Your logged history is kept.','Restart',go2,false);else go2();break}
    case 'set-week':{const p=findProg(d.pid),pw=progWeek(p),n=p.weeks||Math.max(12,pw.week+4);
      menu('Which week are you in?',Array.from({length:n},(_,i)=>({label:`Week ${i+1}${p.deloadWeeks.includes(i+1)?' (deload)':''}${pw.week===i+1?'  ✓':''}`,fn:()=>{setStartForWeek(p,i+1);saveLib();render(true)}})));break}
    case 'sess-deload':{const s=getSess();s.deload=!s.deload;
      if(!cur().sid){const cfg=deloadCfg(s);s.exercises.forEach(e=>{if(s.deload)applyDeload(e,cfg);else undoDeload(e,s.id)})}
      persist();render(true);toast(s.deload?'Deload targets applied':'Back to normal targets');break}
    case 'add-set':{const list=curExList(),e=list[ei],last=e.sets[e.sets.length-1];const isS=cur().v==='session';
      const ns=isS?{id:gid(),kind:'N',v:{},t:last?clone(last.t||{}):{},done:false}:{id:gid(),kind:'N',v:last?clone(last.v||{}):{}};
      if(isS&&last&&last.done)ns.t=Object.assign({},ns.t,clone(last.v));
      e.sets.push(ns);persist();render(true);break}
    case 'del-set':{const list=curExList();list[ei].sets.splice(si,1);persist();render(true);break}
    case 'set-menu':{const list=curExList(),e=list[ei];menu('Set '+(si+1),[
      ...Object.entries(KINDS).map(([k,l])=>({label:(e.sets[si].kind||'N')===k?'✓ '+l:l,fn:()=>{e.sets[si].kind=k;persist();render(true)}})),
      {label:'Delete set',danger:true,fn:()=>{e.sets.splice(si,1);persist();render(true)}},
    ]);break}
    case 'check':toggleCheck(ei,si);break;
    case 'use-prev':{const s=getSess(),e=s.exercises[ei],pv=prevSets(e.exId,s.id,e.runType,!!s.deload)[si];if(pv){e.sets[si].v=clone(pv.v);delete e.sets[si].v.rpe;delete e.sets[si].v.rir;persist();render(true)}break}
    case 'rest-adj':if(S.rest){S.rest.end+=(+d.k)*1000;S.rest.total=Math.max(S.rest.total,Math.ceil((S.rest.end-Date.now())/1000));renderRest()}break;
    case 'rest-skip':S.rest=null;renderRest();break;
    case 'rename-sess':{const s=getSess();ask('Workout name',s.name,v=>{s.name=v;persist();render(true)});break}
    case 'finish':{const s=S.lib.active,st=summarize(s);const undone=s.exercises.reduce((a,e)=>a+e.sets.filter(x=>!x.done).length,0);
      confirmSheet('Finish workout?',`${st.sets} sets · ${s.durMin!=null||!s.timeEdited?fmtMin(durOf(s)):'duration not set'}${st.load?` · ${big(wD(st.load))} ${wu()} load`:''}${st.dist?` · ${fmt(dD(st.dist),2)} ${du()}`:''}.${undone?` ${undone} unticked set${undone>1?'s':''} will be dropped.`:''}`,'Finish',finishSession,false);break}
    case 'discard':confirmSheet('Discard workout?','Everything logged in this workout will be lost.','Discard',()=>{S.lib.active=null;S.rest=null;saveLib();setTab('train')});break;

    case 'open-hist':go({v:'hist',sid:d.sid});break;
    case 'hist-menu':{const s=S.sessions.find(x=>x.id===d.sid);menu(s.name,[
      {label:'Edit workout',fn:()=>{S.editing=clone(s);go({v:'session',sid:s.id})}},
      {label:'Do this workout again',fn:()=>repeatSession(s)},
      {label:'Save as workout in a program',fn:()=>saveAsTemplate(s)},
      {label:'Delete workout',danger:true,fn:()=>delSession(s.id)},
    ]);break}
    case 'edit-hist':{const s=S.sessions.find(x=>x.id===d.sid);S.editing=clone(s);go({v:'session',sid:s.id});break}
    case 'save-edit':{const e=S.editing;finalize(e);
      const i=S.sessions.findIndex(x=>x.id===e.id);if(i>=0)S.sessions[i]=e;sortSessions();saveSession(e);S.editing=null;back();toast('Changes saved');break}
    case 'del-session':delSession(d.sid);break;
    case 'repeat':repeatSession(S.sessions.find(x=>x.id===d.sid));break;

    case 'open-ex':S.exView={metric:null,range:S.exView.range,rt:d.rt||'all'};go({v:'exercise',id:d.id});break;
    case 'exv-range':S.exView.range=d.k;render(true);break;
    case 'exv-metric':S.exView.metric=d.k;render(true);break;
    case 'exv-rt':S.exView.rt=d.k;S.exView.metric=null;render(true);break;
    case 'pr-range':S.prog.range=d.k;render(true);break;
    case 'pr-wk':S.prog.wk=d.k;render(true);break;
    case 'pr-mus':S.prog.mus=d.k;render(true);break;

    case 'new-ex':exDraft={id:null,name:cur().v==='picker'?S.pick.q:'',type:'s',metrics:['weight','reps'],primary:[],secondary:[],equipment:'Barbell',notes:''};go({v:'exedit'});break;
    case 'edit-ex':exDraft=clone(S.lib.custom.find(x=>x.id===d.id));go({v:'exedit'});break;
    case 'exd-type':exDraft.type=d.k;exDraft.metrics=TYPES[d.k].m.slice();if(d.k==='c'&&!exDraft.primary.includes('Cardio'))exDraft.primary.push('Cardio');
      if(d.k==='b'||d.k==='t')exDraft.equipment='Bodyweight';if(d.k==='m'){exDraft.equipment='None';exDraft.secondary=[]}if(d.k==='c')exDraft.equipment='Cardio Machine';render(true);break;
    case 'exd-metric':{const m=d.m,i=exDraft.metrics.indexOf(m);if(i>=0)exDraft.metrics.splice(i,1);else{exDraft.metrics.push(m);exDraft.metrics.sort((a,b)=>METRIC_ORDER.indexOf(a)-METRIC_ORDER.indexOf(b))}render(true);break}
    case 'exd-mus':{const arr=exDraft[d.k],o=exDraft[d.k==='primary'?'secondary':'primary'],i=arr.indexOf(d.m);if(i>=0)arr.splice(i,1);else{arr.push(d.m);const j=o.indexOf(d.m);if(j>=0)o.splice(j,1)}render(true);break}
    case 'save-ex':{const x=exDraft;x.name=(x.name||'').trim();
      if(!x.name)return toast('Give the exercise a name');if(!x.metrics.length)return toast('Pick at least one thing to track');
      if(!x.id){x.id='c-'+gid();S.lib.custom.push(x);saveLib();nav.stack.pop();
        if(cur().v==='picker'){S.pick.sel.push(x.id);S.pick.q=''}
        render();toast('Exercise created')}
      else{const i=S.lib.custom.findIndex(c=>c.id===x.id);S.lib.custom[i]=x;saveLib();back();toast('Exercise saved')}
      break}
    case 'del-ex':confirmSheet('Delete exercise?','It will be removed from your library and programs. Logged sets stay in your history as “Deleted exercise”.','Delete',()=>{
      S.lib.custom=S.lib.custom.filter(x=>x.id!==d.id);S.lib.programs.forEach(p=>p.workouts.forEach(w=>w.exercises=w.exercises.filter(e=>e.exId!==d.id)));saveLib();back()});break;

    case 'set-wu':U().wu=d.k;saveLib();render(true);break;
    case 'set-du':U().du=d.k;saveLib();render(true);break;
    case 'set-theme':U().theme=d.k;applyTheme();saveLib();render(true);break;
    case 'set-eff':U().effort=d.k;saveLib();render(true);break;
    case 'export':{const txt=JSON.stringify({forge:2,lib:S.lib,sessions:S.sessions});
      try{navigator.clipboard.writeText(txt).then(()=>toast('Backup copied — paste it somewhere safe'),()=>showBackup(txt))}catch(e){showBackup(txt)}break}
    case 'import':ask('Restore backup','',v=>{try{const o=JSON.parse(v);if(!o.lib||!Array.isArray(o.sessions))throw 0;
      confirmSheet('Replace all data?','This will replace your programs, exercises and history with the backup.','Restore',()=>{
        const old=S.sessions.map(s=>s.id);S.lib=normalizeLib(o.lib);S.sessions=o.sessions.map(normalizeSession);sortSessions();saveLib();
        old.filter(id=>!S.sessions.some(s=>s.id===id)).forEach(deleteSessionStore);S.sessions.forEach(saveSession);render();toast('Backup restored')})}
      catch(e){toast('That doesn’t look like a Forge backup')}},{multiline:true,placeholder:'Paste backup text here',ok:'Continue'});break;
  }
});
function showBackup(txt){openSheet(`<h3>Your backup</h3><p class="sub">Select all and copy this text.</p><textarea class="inp" rows="8" readonly>${esc(txt)}</textarea><button class="btn sec2 full" style="margin-top:12px" data-a="sheet-close">Done</button>`)}
function delSession(id){confirmSheet('Delete workout?','This removes it from your history and progress.','Delete',()=>{S.sessions=S.sessions.filter(x=>x.id!==id);deleteSessionStore(id);S.editing=null;nav={tab:'history',stack:[{v:'history'}]};render()})}
function repeatSession(s){
  const tpl=s.programId&&findProg(s.programId)?.workouts.find(w=>w.id===s.workoutId);
  beginSession(newSession(s.name,{programId:s.programId,workoutId:s.workoutId,exercises:s.exercises.map(e=>{const te=tpl&&tpl.exercises.find(x=>x.exId===e.exId);
    return {id:gid(),exId:e.exId,rest:e.rest,notes:e.notes||'',repLo:e.repLo??te?.repLo??defaultRange(getEx(e.exId))[0],repHi:e.repHi??te?.repHi??defaultRange(getEx(e.exId))[1],tRpe:e.tRpe??null,prog:e.prog!==false,runType:e.runType||null,effMode:e.effMode||null,
      sets:e.sets.map(x=>({id:gid(),kind:x.kind||'N',v:{},t:{},done:false}))}})}));
}
function saveAsTemplate(s){
  const ps=S.lib.programs;
  const add=p=>{p.workouts.push({id:gid(),name:s.name,exercises:s.exercises.map(e=>{const [lo,hi]=defaultRange(getEx(e.exId));
    return {id:gid(),exId:e.exId,rest:e.rest,notes:e.notes||'',repLo:e.repLo??lo,repHi:e.repHi??hi,tRpe:e.tRpe??null,prog:e.prog!==false,runType:e.runType||null,effMode:e.effMode||null,
      sets:e.sets.map(x=>{const v=clone(x.v);delete v.rpe;delete v.rir;return {id:gid(),kind:x.kind||'N',v}})}})});saveLib();toast(`Added to ${p.name}`)};
  const items=ps.map(p=>({label:p.name,fn:()=>add(p)}));
  items.push({label:'+ New program',fn:()=>ask('New program','',n=>{const p=normProg({id:gid(),name:n,description:'',workouts:[]});ps.push(p);add(p)})});
  menu('Add to which program?',items);
}

document.addEventListener('change',ev=>{
  const el=ev.target,c=el.dataset.c;if(!c)return;const d=el.dataset,ei=d.ei!=null?+d.ei:null,si=d.si!=null?+d.si:null;
  switch(c){
    case 'setv':{const list=curExList(),e=list[ei],st=e.sets[si],ex=getEx(e.exId);st.v=st.v||{};
      if(d.m==='rir'||d.m==='rpe'){let n=parseFloat(el.value);if(isNaN(n))delete st.v[d.m];else{n=d.m==='rir'?Math.max(0,Math.min(10,n)):Math.max(1,Math.min(10,n));st.v[d.m]=n}
        el.value=st.v[d.m]!=null?fmt(st.v[d.m],1):'';
        const other=el.parentElement.querySelector(`[data-m="${d.m==='rir'?'rpe':'rir'}"]`);if(other&&!other.value&&st.v[d.m]!=null)other.placeholder=fmt(10-st.v[d.m],1);
        persist();break}
      const val=fromInput(d.m,el.value,ex);if(val==null)delete st.v[d.m];else st.v[d.m]=val;el.value=val==null?'':toDisp(d.m,val);
      const pc=document.getElementById(`pace-${ei}-${si}`);if(pc){const s=getSess();pc.textContent=livePace(ex,st,prevSets(e.exId,s.id,e.runType,!!s.deload)[si])}
      persist();break}
    case 'rest':{curExList()[ei].rest=+el.value;persist();break}
    case 'runtype':{const e=curExList()[ei];e.runType=el.value||null;e.tRpe=null;
      if(cur().v==='session'&&!cur().sid){const s=getSess();applySug(e,computeSug(e,s.id));if(s.deload)applyDeload(e,deloadCfg(s))}persist();render(true);break}
    case 'exnote':{curExList()[ei].notes=el.value;persist();break}
    case 'sess-note':{getSess().notes=el.value;persist();break}
    case 'sess-date':case 'sess-time':{const s=getSess(),dEl=document.querySelector('[data-c=sess-date]'),tEl=document.querySelector('[data-c=sess-time]');if(!dEl.value)break;
      const [y,mo,da]=dEl.value.split('-').map(Number),[hh,mm]=(tEl.value||'12:00').split(':').map(Number);const oldDur=durOf(s);
      s.startedAt=new Date(y,mo-1,da,hh,mm).getTime();s.timeEdited=true;if(cur().sid&&s.durMin==null)s.durMin=Math.round(oldDur/60000);
      const p=s.programId&&findProg(s.programId);if(p){const pw=progWeek(p,s.startedAt);s.week=pw&&!pw.done?pw.week:null}
      persist();render(true);break}
    case 'sess-dur':{const s=getSess(),m=parseDurMin(el.value);s.durMin=m;el.value=m!=null?m:'';persist();render(true);break}
    case 'prog-desc':{findProg(d.pid).description=el.value.trim();saveLib();break}
    case 'prog-repeat':{findProg(d.pid).repeat=el.checked;saveLib();render(true);break}
    case 'ramp-on':{findProg(d.pid).ramp.on=el.checked;saveLib();render(true);break}
    case 'ramp-from':case 'ramp-to':{findProg(d.pid).ramp[c.slice(5)]=+el.value;saveLib();render(true);break}
    case 'dl-sets':case 'dl-load':case 'dl-rir':case 'dl-cardio':{findProg(d.pid).deload[c.slice(3)]=+el.value;saveLib();break}
    case 'pick-muscle':S.pick.muscle=el.value;$('#pick-list').innerHTML=pickList();break;
    case 'lib-muscle':S.libf.muscle=el.value;$('#lib-list').innerHTML=libList();break;
    case 'exd-name':exDraft.name=el.value;break;
    case 'exd-equip':exDraft.equipment=el.value;break;
    case 'exd-notes':exDraft.notes=el.value;break;
    case 'def-rest':U().rest=+el.value;saveLib();break;
    case 'def-t':U().tRpe=+el.value;saveLib();break;
    case 'inc-bar':case 'inc-db':{const n=parseFloat(el.value);if(n>0){U().inc[wu()][c==='inc-bar'?'bar':'db']=n;saveLib()}else el.value=U().inc[wu()][c==='inc-bar'?'bar':'db'];break}
  }
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='mq-name'&&mobDraft){const ex=allEx().find(x=>x.type==='m'&&x.name.toLowerCase()===ev.target.value.trim().toLowerCase());
    if(ex){mobDraft.muscles=ex.primary.slice();mobDraft.metrics=ex.metrics.slice();document.querySelectorAll('[data-a=mq-mus]').forEach(b=>b.classList.toggle('on',mobDraft.muscles.includes(b.dataset.m)))}}
  const el=ev.target,c=el.dataset.c;
  if(c==='pick-q'){S.pick.q=el.value;$('#pick-list').innerHTML=pickList()}
  else if(c==='lib-q'){S.libf.q=el.value;$('#lib-list').innerHTML=libList()}
  else if(c==='exd-name'){exDraft.name=el.value}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&ev.target.id==='sheet-inp'&&ev.target.tagName==='INPUT'){ev.preventDefault();sheetOk&&sheetOk()}
  else if(ev.key==='Enter'&&ev.target.classList.contains('cell')){ev.preventDefault();const cells=[...document.querySelectorAll('.cell')];const i=cells.indexOf(ev.target);ev.target.blur();if(cells[i+1])cells[i+1].focus()}
  else if(ev.key==='Escape'&&!$('#sheet-wrap').classList.contains('hidden'))closeSheet();
});

/* ============================== BOOT ============================== */
(function boot(){
  const local=lsGet();
  if(local&&local.lib){S.lib=normalizeLib(local.lib);S.sessions=(local.sessions||[]).map(normalizeSession);sortSessions()}
  render();
  initCloud();
})();

</script>
</body>
